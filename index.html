<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1020">
  <meta name="description" content="Salam AI — Smart Golden Visa Student Assistant">
  <meta name="application-name" content="Salam AI">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Salam AI">
  <title>Salam AI</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; background: #0b1020; overflow: hidden; }
    main { width: 100%; height: 100%; height: 100dvh; }
    iframe { display: block; width: 100%; height: 100%; border: 0; background: #0b1020; }
    #offline { display: none; position: fixed; inset: 0; padding: 2rem; color: #fff; background: #0b1020; font: 16px/1.8 system-ui, sans-serif; text-align: center; align-content: center; }
  </style>
</head>
<body>
  <main>
    <iframe
      title="Salam AI — Smart Golden Visa Student Assistant"
      src="https://salam-uae.streamlit.app/?embed=true&show_footer=false"
      allow="clipboard-read; clipboard-write"
      allowfullscreen>
    </iframe>
  </main>
  <section id="offline" role="status">
    <h1>Salam AI</h1>
    <p>اتصال الإنترنت مطلوب لتشغيل المساعد. اتصل بالإنترنت ثم أعد فتح التطبيق.</p>
  </section>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js', { scope: './' })
          .catch((error) => console.error('Service worker registration failed:', error));
      });
    }
    function updateNetworkStatus() {
      document.getElementById('offline').style.display = navigator.onLine ? 'none' : 'grid';
    }
    window.addEventListener('online', updateNetworkStatus);
    window.addEventListener('offline', updateNetworkStatus);
    updateNetworkStatus();
  </script>
</body>
</html>
